spring:
  application:
    name: sistema-gestion-empleados
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:empleados_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true